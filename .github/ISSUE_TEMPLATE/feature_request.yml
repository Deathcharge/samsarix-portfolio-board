name: Feature request
description: Propose a focused improvement to the portfolio board.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing GitHub or dashboard behavior that almost solves the problem.
  - type: checkboxes
    id: scope
    attributes:
      label: Product boundary
      options:
        - label: This request can remain read-only and does not redefine activity as health.
          required: true
